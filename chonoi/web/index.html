<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp của nhóm BOTS (Ticket-02 mục 2: menu, pause, HUD). CHỈ ĐỌC snapshot từ GET /state,
 * gửi phím qua POST /input và thao tác màn hình qua POST /ui. Mọi chữ dùng font không chân, cỡ >= 18 px.
 * Phím: WASD / mũi tên = di chuyển · E = tương tác · Space = bắt cá · Esc/P = tạm dừng · R = chơi lại
 *       Shop: 1 = bình oxy, 2 = áo phao, Enter = đóng Shop · Màn hình: Enter/Space hoặc bấm chuột.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const FONT = "system-ui, 'Segoe UI', Roboto, sans-serif";
const MIN_PX = 18;

// ---------- dữ liệu hiển thị ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "bông điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const UPGRADE_NAME = { oxygen: "Bình oxy", hp: "Áo phao" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dn = (d) => DISH_NAME[d] || d;

// ---------- vào: phím và chuột ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
let buttons = [];  // vùng bấm chuột của frame hiện tại

function send(path, obj) {
  queue.push([path, JSON.stringify(obj)]);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const [path, body] = queue.shift();
    try { await fetch(path, { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function currentInput() {
  const phase = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase === "quan") dy = -dy;                               // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  send("/input", JSON.parse(s));
}
const screen = () => (snap && snap.ui && snap.ui.screen) || null;
function ui(action) { send("/ui", { action }); }
function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  const sc = screen();
  if (sc) {  // đang ở menu / màn hình chuyển cảnh
    if (sc === "menu") { if (k === "enter" || k === " ") ui("play"); else if (k === "escape") ui("quit"); }
    else if (sc === "summary") { if (k === "enter" || k === "r") ui("menu"); }
    else if (sc !== "quit") ui("continue");
    return;
  }
  if (snap && snap.state === "paused" && k === "m") { ui("menu"); return; }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "enter" && snap && snap.phase === "shop") down.add("shop_done");
  else if ((k === "1" || k === "2") && snap && snap.phase === "shop") send("/input", { buy: k === "1" ? "oxygen" : "hp" });
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
cv.addEventListener("click", (e) => {
  const b = buttons.find((b) => e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h);
  if (b) b.fn();
});

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- tiện ích vẽ ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + Math.max(MIN_PX, o.size || MIN_PX) + "px " + FONT;
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow !== false) { ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 3; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
  return ctx.measureText(s).width;
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h / 2 + 1, { align: "center", base: "middle" });
}
function panel(x, y, w, h, alpha = .72) {
  ctx.fillStyle = `rgba(12,18,24,${alpha})`; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function button(label, x, y, w, h, fn, primary) {
  ctx.fillStyle = primary ? "#e0893a" : "rgba(255,255,255,.14)"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  text(label, x + w / 2, y + h / 2 + 1, { align: "center", base: "middle", bold: primary });
  buttons.push({ x, y, w, h, fn });
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const blink = () => Math.floor(performance.now() / 300) % 2 === 0;
function counts(arr) { const c = {}; (arr || []).forEach((k) => (c[k] = (c[k] || 0) + 1)); return c; }
function itemsLine(obj) { const ks = Object.keys(obj || {}); return ks.length ? ks.map((k) => kn(k) + " ×" + obj[k]).join(", ") : "(trống)"; }

// thông báo ngắn theo sự kiện (3 s gần nhất)
const EVENT_MSG = {
  gather: (d) => "Hái được " + kn(d.kind), fish_caught: (d) => "Bắt được " + d.yield + " " + kn(d.kind),
  hold_full: () => "Giỏ đầy!", choke: (d) => "Ngạt nước! Còn " + d.hp + " Máu", faint: () => "Út Sen ngất xỉu…",
  monster_hit: (d) => "Cá Sấu cắn! Rơi " + (d.lost || []).length + " món", oxygen_empty: () => "Hết hơi!",
  fish_spawned: (d) => "Đàn " + kn(d.kind) + " mới", customer_arrived: (d) => "Khách gọi " + dn(d.dish_id),
  no_dish: () => "Khách tới mà hết món", cook_started: (d) => "Bắt đầu nấu " + dn(d.dish_id),
  dish_ready: (d) => dn(d.dish_id) + " chín rồi!", served: (d) => "Đã dọn " + dn(d.dish_id) + (d.tip ? " (boa " + d.tip + "k)" : ""),
  paid: (d) => "Khách trả " + d.amount + "k", customer_left: (d) => d.reason === "patience" ? "Khách bỏ về! Uy tín giảm" : "Khách về",
  bought: (d) => "Đã mua " + (UPGRADE_NAME[d.upgrade] || d.upgrade) + " cấp " + d.level,
  buy_failed: (d) => ({ funds: "Không đủ tiền", max_level: "Đã tối đa", unknown: "Không bán món này" })[d.reason] || "Mua không được",
};
function toasts(w, h) {
  const now = snap.tick;
  const ev = (snap.events || []).filter((e) => EVENT_MSG[e.name] && now - e.tick < 180).slice(-4);
  ev.forEach((e, i) => {
    const msg = EVENT_MSG[e.name](e.data || {});
    const y = h - 110 - (ev.length - 1 - i) * 30;
    ctx.font = MIN_PX + "px " + FONT;
    const tw = ctx.measureText(msg).width + 24;
    panel(w - tw - 16, y - 22, tw, 28, .8);
    text(msg, w - 28, y, { align: "right" });
  });
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 5;
  const top = 96, bottom = 92;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const g0 = ctx.createLinearGradient(0, top, 0, oy);
  g0.addColorStop(0, "#f7c9a8"); g0.addColorStop(1, "#fde7c8");  // ánh hồng buổi sớm
  ctx.fillStyle = g0; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#b48a4e"); g.addColorStop(0.35, "#7a5a30"); g.addColorStop(1, "#2b2414");  // nước phù sa
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#f5e3c0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  for (let d = 10; d < D; d += 10) {  // ranh nông / giữa / sâu
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); ctx.setLineDash([]);
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  // nút hái
  (snap.nodes || []).forEach((n) => {
    ctx.globalAlpha = n.ready !== false ? 1 : 0.3;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  // Cá Sấu
  const p = snap.player;
  let monsterNear = false;
  const species = (meta.monsters && meta.monsters.species) || {};
  (snap.monsters || []).forEach((m) => {
    const sp = species[m.kind] || {};
    if (p && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= (sp.detect_radius || 10)) monsterNear = true;
    ctx.save(); ctx.translate(sx(m.pos[0]), sy(m.pos[1]));
    ctx.globalAlpha = m.state === "recoil" ? 0.5 : 1;
    ctx.fillStyle = m.state === "chase" ? "#6a8f3a" : "#4f6b2c";
    ctx.beginPath(); ctx.ellipse(0, 0, 2.2 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(1.5 * s, -0.25 * s, 0.15 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  });
  // người chơi
  let hint = null;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = !p.at_surface;
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
    // gợi ý hái / cập bến / bắt cá
    if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) hint = "E: cập bến, về quán";
    else if (!underwater) {
      const n = (snap.nodes || []).find((n) => n.ready && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= (meta.interact_radius || 2));
      if (n) hint = "E: hái " + kn(n.kind);
    } else if (!p.catch_cd_ticks) {
      const f = (snap.fish || []).find((f) => Math.hypot(f.pos[0] - p.pos[0], f.pos[1] - p.pos[1]) <= (meta.catch_radius || 2));
      if (f) hint = "Space: bắt " + kn(f.kind);
    }
    if (hint) {  // giữ chữ gợi ý trong màn hình (bến nằm sát mép trái)
      ctx.font = "bold " + MIN_PX + "px " + FONT;
      const half = ctx.measureText(hint).width / 2 + 8;
      text(hint, Math.min(w - half, Math.max(half, px)), py - 1.2 * s - 6, { align: "center", bold: true, color: "#fff3c4" });
    }
  }
  // HUD trên: thời gian, oxy, Máu, độ sâu, hồi bắt
  panel(0, 0, w, 88, .8);
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 16, 34, { size: 26, bold: true, color: tl <= 1800 ? (blink() ? "#ff5252" : "#ffab91") : "#e8eef2" });
  if (p) {
    const frac = p.oxygen_ticks / p.oxygen_max_ticks, low = frac < 0.25;
    bar(130, 12, 260, 28, frac, low ? (blink() ? "#ff1744" : "#b71c1c") : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text("Máu " + hs, 410, 34, { size: 24, color: "#ff6b81" });
    const depth = p.pos[1], zone = depth <= 0.5 ? "mặt nước" : depth < 10 ? "nông" : depth < 20 ? "giữa" : "sâu";
    text(`Độ sâu ${depth.toFixed(1)} m (${zone})`, 16, 72);
    text(p.catch_cd_ticks > 0 ? "Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s" : "Bắt cá: sẵn sàng", 300, 72, { color: p.catch_cd_ticks > 0 ? "#ffcc80" : "#a5d6a7" });
    if (snap.day) text(`Ngày ${snap.day} · Tiền ${snap.money}k · Uy tín ${snap.reputation.toFixed(1)}`, w - 16, 34, { align: "right" });
    if (p.oxygen_ticks === 0 && !p.at_surface) text("Hết hơi!", w / 2, 140, { align: "center", size: 34, bold: true, color: blink() ? "#ff5252" : "#ffffff" });
  }
  if (monsterNear) {
    ctx.strokeStyle = "#b44cff"; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10);
    text("Thủy quái!", w / 2, 186, { align: "center", size: 34, bold: true, color: "#d68cff" });
  }
  // HUD dưới: giỏ theo loại + danh sách cần lấy
  panel(0, h - bottom, w, bottom, .8);
  const have = counts(snap.hold);
  text(`Giỏ ${(snap.hold || []).length}/${snap.hold_capacity}: ` + itemsLine(have), 16, h - bottom + 30);
  const need = snap.day_plan && snap.day_plan.ingredients;
  if (need) {
    let x = 16;
    x += text("Cần lấy:", x, h - bottom + 64, { color: "#ffe082" }) + 10;
    Object.keys(need).forEach((k) => {
      const got = have[k] || 0, ok = got >= need[k];
      x += text(`${kn(k)} ${got}/${need[k]}`, x, h - bottom + 64, { color: ok ? "#a5d6a7" : "#ffffff" }) + 18;
    });
  } else text("WASD bơi · E hái/cập bến · Space bắt cá · Esc/P tạm dừng", 16, h - bottom + 64, { color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {}, menu = snap.menu_data || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 96, bottom = 92;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom - 10) / Z));
  const ox = (w - s * X) / 2, oy = top + 5;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  for (let x = 1; x < X; x += 2) { ctx.fillStyle = "#ffd54f"; ctx.beginPath(); ctx.arc(sx(x), sy(Z) + 6, 4, 0, Math.PI * 2); ctx.fill(); }  // đèn dây vàng
  // bếp: tiến độ nấu / món chín
  (snap.stoves || []).forEach((st) => {
    const cx = sx(st.pos[0]), cy = sy(st.pos[1]);
    ctx.fillStyle = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillRect(cx - 0.8 * s, cy - 0.8 * s, 1.6 * s, 1.6 * s);
    if (st.state === "cooking" && st.dish) {
      const total = Math.round(((menu[st.dish.dish_id] || {}).cook_s || 1) * 60);
      bar(cx - 0.9 * s, cy + 0.95 * s, 1.8 * s, 20, 1 - st.cook_ticks_left / total, "#ffb74d", Math.ceil(st.cook_ticks_left / 60) + "s");
    } else if (st.state === "ready") text("Chín! E", cx, cy + 0.95 * s + 18, { align: "center", bold: true, color: blink() ? "#c6ff00" : "#ffffff" });
  });
  // bàn + khách: món và kiên nhẫn
  const patMax = (meta.patience_s || 60) * 60, byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]);
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(cx, cy, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    const c = byTable[tb.id];
    if (c) {
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy - 1.4 * s, 0.5 * s, 0, Math.PI * 2); ctx.fill();
      text(dn(c.dish_id), cx, cy + 1.3 * s + 14, { align: "center", color: "#2a1a0a", shadow: false });
      if (c.state === "waiting") {
        const frac = c.patience_ticks_left / patMax;
        bar(cx - 1.1 * s, cy - 2.4 * s, 2.2 * s, 20, frac, frac < 0.25 ? (blink() ? "#ff1744" : "#b71c1c") : "#66bb6a", Math.ceil(c.patience_ticks_left / 60) + "s");
      } else text("đang ăn", cx, cy - 2.1 * s, { align: "center", color: "#1b5e20", shadow: false });
    }
  });
  // người chơi + món trên tay
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, (meta.interact_radius || 1.5) * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  // HUD trên: đồng hồ ca, tiền ca, uy tín, món trên tay
  panel(0, 0, w, 88, .8);
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 16, 34, { size: 26, bold: true, color: tl <= 1800 ? (blink() ? "#ff5252" : "#ffab91") : "#e8eef2" });
  const st = (snap.ui && snap.ui.stats && snap.ui.stats.day) || {};
  const shiftMoney = snap.money - (st.money_start || 0);
  text(`Tiền ca ${shiftMoney}k · Tổng ${snap.money}k · Uy tín ${snap.reputation.toFixed(1)} · Điểm ${snap.score}`, 130, 34);
  text("Trên tay: " + (snap.hand ? dn(snap.hand.dish_id) : "(trống)"), 16, 72, { color: snap.hand ? "#fff3c4" : "#9fb3c0" });
  if (snap.day) text("Ngày " + snap.day, w - 16, 34, { align: "right" });
  // HUD dưới: kho khả dụng (tồn trừ phần giữ)
  const avail = Object.assign({}, snap.stock || {});
  (snap.customers || []).forEach((c) => Object.keys(c.reserved || {}).forEach((k) => (avail[k] = (avail[k] || 0) - c.reserved[k])));
  Object.keys(avail).forEach((k) => { if (avail[k] <= 0) delete avail[k]; });
  panel(0, h - bottom, w, bottom, .8);
  text("Kho khả dụng: " + itemsLine(avail), 16, h - bottom + 30);
  text("WASD đi · E nấu / bưng / dọn món · Esc/P tạm dừng", 16, h - bottom + 64, { color: "#9fb3c0" });
}

// ----- SHOP -----
function drawShop(w, h) {
  ctx.fillStyle = "#2a1d14"; ctx.fillRect(0, 0, w, h);
  const cfg = (snap.shop_cfg && snap.shop_cfg.upgrades) || {};
  const pw = Math.min(720, w - 40), px = (w - pw) / 2, py = 70;
  panel(px, py, pw, 470, .9);
  text("Tiệm Má Tư — Ngày " + snap.day, px + 24, py + 44, { size: 28, bold: true });
  text(`Tiền ${snap.money}k · Shop đóng sau ${Math.ceil(snap.time_left_ticks / 60)}s`, px + 24, py + 80, { color: "#ffe082" });
  ["oxygen", "hp"].forEach((kind, i) => {
    const levels = cfg[kind] || [], bought = (snap.upgrades || {})[kind] || 0, active = (snap.active_upgrades || {})[kind] || 0;
    const nxt = levels[bought];
    const y = py + 130 + i * 110;
    panel(px + 24, y, pw - 48, 92, .6);
    text(`${i + 1}. ${UPGRADE_NAME[kind]} — cấp ${bought}/${levels.length} (đang dùng cấp ${active})`, px + 40, y + 34, { bold: true });
    const eff = nxt ? (kind === "oxygen" ? nxt.oxygen_max_s + " giây oxy" : nxt.hp_max + " Máu") : "";
    text(nxt ? `Cấp ${nxt.level}: ${eff} — giá ${nxt.price}k` : "Đã tối đa", px + 40, y + 70, { color: nxt && snap.money >= nxt.price ? "#a5d6a7" : "#ef9a9a" });
    if (nxt) button("Mua (" + (i + 1) + ")", px + pw - 180, y + 24, 136, 44, () => send("/input", { buy: kind }), snap.money >= nxt.price);
  });
  text("Hàng dư cuối ca (bỏ sau Shop): " + itemsLine(snap.stock), px + 24, py + 380, { color: "#cfd8dc" });
  button("Đóng Shop (Enter)", px + pw / 2 - 130, py + 404, 260, 48, () => { send("/input", { shop_done: true }); setTimeout(() => send("/input", { shop_done: false }), 60); }, true);
}

// ----- màn hình: menu, intro, kết quả, tổng kết, pause -----
function dim(w, h, a = .7) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, w, h); }
function card(w, h, cw, ch) { const x = (w - cw) / 2, y = (h - ch) / 2; panel(x, y, cw, ch, .95); return [x, y]; }
function canCook(stock, dishes, menu) {
  return Object.keys(dishes || {}).map((d) => {
    const r = (menu[d] || {}).recipe || {};
    const n = Math.min(...Object.keys(r).map((k) => Math.floor((stock[k] || 0) / r[k])));
    return [d, isFinite(n) ? n : 0];
  });
}
function drawScreen(w, h) {
  const sc = screen(), st = (snap.ui && snap.ui.stats) || {}, day = st.day || {}, tot = st.total || {};
  const plan = snap.day_plan || {}, menu = snap.menu_data || {};
  if (sc === "menu") {
    dim(w, h, .85);
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 110, { align: "center", size: 48, bold: true, color: "#ffcc80" });
    text("Út Sen lặn bắt cá, hái rau buổi sáng · tối mở quán trên nhà bè Má Tư", w / 2, h / 2 - 60, { align: "center", color: "#cfd8dc" });
    button("Chơi (Enter)", w / 2 - 120, h / 2 - 20, 240, 54, () => ui("play"), true);
    button("Thoát (Esc)", w / 2 - 120, h / 2 + 50, 240, 54, () => ui("quit"));
  } else if (sc === "quit") {
    dim(w, h, .95);
    text("Đã thoát. Có thể đóng tab này.", w / 2, h / 2, { align: "center", size: 28 });
  } else if (sc === "day_intro") {
    dim(w, h, .8);
    const [x, y] = card(w, h, Math.min(760, w - 40), 380);
    text("Ngày " + snap.day, x + 32, y + 56, { size: 40, bold: true, color: "#ffcc80" });
    text("Má Tư dặn: hôm nay quán định nấu", x + 32, y + 100);
    Object.keys(plan.dishes || {}).forEach((d, i) => text(`• ${dn(d)} ×${plan.dishes[d]}`, x + 48, y + 136 + i * 30));
    text("Cần lấy: " + itemsLine(plan.ingredients), x + 32, y + 250, { color: "#ffe082" });
    const left = snap.ui.screen_left_s;
    text(`Tự bắt đầu sau ${left == null ? "" : Math.ceil(left)}s · nhấn phím bất kỳ để lặn ngay`, x + 32, y + 340, { color: "#9fb3c0" });
    buttons.push({ x, y, w: Math.min(760, w - 40), h: 380, fn: () => ui("continue") });
  } else if (sc === "evening_intro") {
    dim(w, h, .8);
    const [x, y] = card(w, h, Math.min(760, w - 40), 360);
    text("Chiều tối — mở quán", x + 32, y + 56, { size: 36, bold: true, color: "#ffcc80" });
    text("Nhập kho: " + itemsLine(day.delivered), x + 32, y + 104);
    text("Món nấu được (theo kế hoạch):", x + 32, y + 146);
    canCook(snap.stock || {}, plan.dishes, menu).forEach(([d, n], i) =>
      text(`• ${dn(d)}: ${n} suất`, x + 48, y + 180 + i * 30, { color: n > 0 ? "#a5d6a7" : "#ef9a9a" }));
    text("Nhấn phím bất kỳ để mở quán", x + 32, y + 330, { color: "#9fb3c0" });
    buttons.push({ x, y, w: Math.min(760, w - 40), h: 360, fn: () => ui("continue") });
  } else if (sc === "day_result") {
    dim(w, h, .8);
    const [x, y] = card(w, h, Math.min(700, w - 40), 360);
    text("Kết quả Ngày " + snap.day, x + 32, y + 56, { size: 36, bold: true, color: "#ffcc80" });
    const repDelta = day.rep_start == null ? 0 : snap.reputation - day.rep_start;
    const lines = [`Khách đã phục vụ: ${day.served || 0}`, `Khách bỏ đi: ${day.left || 0}`,
      `Tiền ca: ${snap.money - (day.money_start || 0)}k (boa ${day.tips || 0}k)`,
      `Uy tín: ${snap.reputation.toFixed(1)} (${repDelta >= 0 ? "+" : ""}${repDelta.toFixed(1)})`];
    lines.forEach((l, i) => text(l, x + 32, y + 110 + i * 40));
    text("Nhấn phím bất kỳ để vào Shop", x + 32, y + 330, { color: "#9fb3c0" });
    buttons.push({ x, y, w: Math.min(700, w - 40), h: 360, fn: () => ui("continue") });
  } else if (sc === "summary") {
    dim(w, h, .85);
    const [x, y] = card(w, h, Math.min(700, w - 40), 380);
    text("Tổng kết", x + 32, y + 56, { size: 40, bold: true, color: "#ffcc80" });
    const sold = tot.sold || {}, best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
    [`Tổng tiền thu: ${snap.earned}k (còn ${snap.money}k)`, `Tổng điểm: ${snap.score}`, `Uy tín: ${snap.reputation.toFixed(1)}`,
     `Món bán chạy: ${best ? dn(best) + " (" + sold[best] + " suất)" : "chưa bán được món nào"}`,
     `Khách phục vụ ${tot.served || 0} · bỏ đi ${tot.left || 0}`].forEach((l, i) => text(l, x + 32, y + 110 + i * 40));
    button("Về menu (Enter)", x + 32, y + 310, 240, 48, () => ui("menu"), true);
  }
}
function drawPause(w, h) {
  dim(w, h, .6);
  const [x, y] = card(w, h, 420, 260);
  text("Tạm dừng", x + 210, y + 60, { align: "center", size: 36, bold: true });
  button("Tiếp tục (Esc/P)", x + 90, y + 100, 240, 50, () => { send("/input", { pause: true }); setTimeout(() => send("/input", { pause: false }), 60); }, true);
  button("Về menu (M)", x + 90, y + 170, 240, 50, () => ui("menu"));
}
function drawFinishedStandalone(w, h) {
  dim(w, h, .55);
  const [x, y] = card(w, h, 480, 140);
  const label = snap.mode === "gather" ? "Buổi sáng kết thúc" : "Hết ca tối";
  text(label + ": " + (snap.reason || ""), x + 240, y + 56, { align: "center", size: 24, bold: true });
  text("Nhấn R để chơi lại", x + 240, y + 100, { align: "center", color: "#cfd8dc" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  buttons = [];
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" }); return; }
  if (snap.phase === "shop") drawShop(w, h);
  else if (snap.phase === "quan") drawQuan(w, h);
  else drawGather(w, h);
  if (!screen()) toasts(w, h);
  if (snap.state === "paused") drawPause(w, h);
  if (snap.finished && snap.mode !== "day") drawFinishedStandalone(w, h);
  if (screen()) drawScreen(w, h);
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 120, { align: "center", color: "#ff8a80" });
  if (snap.error) text("Luật báo lỗi — xem terminal. R để chơi lại.", w / 2, 150, { align: "center", color: "#ff8a80" });
}
requestAnimationFrame(frame);
</script>
